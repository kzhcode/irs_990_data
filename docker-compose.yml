

# Add volumes
volumes:
  postgres_data:
  airflow_logs:
  irs990_data:


# Shared configuration
x-airflow-common: &airflow-common
  build:
   context: .
   dockerfile: Dockerfile
  env_file:
   - .env
  volumes:
   - ./dags:/opt/airflow/dags
   - airflow_logs:/opt/airflow/logs
   - irs990_data:/opt/airflow/data
  depends_on:
   postgres:
    condition: service_healthy


# Services
services:

  # PostgreSQL service
  postgres:
   image: postgres:16
   env_file:
    - .env
   ports:
    - "5433:5432"
   volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
   healthcheck:
    test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
    interval: 5s
    retries: 10

  # Airflow init service
  airflow-init:
   <<: *airflow-common
   command: >
    bash -c "
     airflow db migrate &&
     airflow users create  --username $${_AIRFLOW_WWW_USER_USERNAME} --password $${_AIRFLOW_WWW_USER_PASSWORD} --firstname Admin --lastname User --role Admin --email kmzr4x@umsystem.edu
    "

   restart: "no"

  # Airflow Webserver
  airflow-webserver:
   <<: *airflow-common
   command: airflow webserver
   ports:
    - "8080:8080"
   restart: unless-stopped
   depends_on:
    airflow-init:
     condition: service_completed_successfully

  # Airflow Scheduler
  airflow-scheduler:
   <<: *airflow-common
   command: airflow scheduler
   restart: unless-stopped
   depends_on:
    airflow-init:
     condition: service_completed_successfully

